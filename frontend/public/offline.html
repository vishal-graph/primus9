<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Offline — TatvaOps Vision</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #0f0f1a 50%, #0a0f1a 100%);
      color: #e4e4e7; padding: 24px; text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px; font-weight: 600; }
    p { margin: 0 0 24px; color: #a1a1aa; font-size: 0.95rem; line-height: 1.5; max-width: 320px; }
    a {
      display: inline-block; padding: 12px 24px; background: #6366f1; color: #fff;
      text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 0.9rem;
    }
    a:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div>
    <h1>You’re offline</h1>
    <p>Check your connection and try again. Cached pages may still be available when you’re back online.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
