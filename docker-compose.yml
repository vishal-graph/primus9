# TatvaOps Vision - Docker Compose
# Development and local testing configuration

version: '3.8'

services:
  # ==========================================
  # Frontend (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:4000
      - NEXT_PUBLIC_API_URL=https://vision.tatvaops.com/api
    depends_on:
      - backend
    networks:
      - tatvaops-network
    restart: unless-stopped

  # ==========================================
  # Backend API (Express)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres
    networks:
      - tatvaops-network
    restart: unless-stopped

  # ==========================================
  # Worker Service
  # ==========================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=2
    depends_on:
      - redis
      - postgres
    networks:
      - tatvaops-network
    restart: unless-stopped
    # Scale workers as needed
    deploy:
      replicas: 2

  # ==========================================
  # Redis (Cache & Rate Limiting)
  # ==========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tatvaops-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ==========================================
  # PostgreSQL (Development only)
  # Production uses AWS RDS
  # ==========================================
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=tatvaops
      - POSTGRES_PASSWORD=tatvaops_dev
      - POSTGRES_DB=tatvaops_vision
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tatvaops-network
    restart: unless-stopped

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tatvaops-network
    restart: unless-stopped

networks:
  tatvaops-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:

